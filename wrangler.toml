"$schema" = "./node_modules/wrangler/config-schema.json"
name = "tweeva"
main = ".open-next/worker.js"
compatibility_date = "2026-03-23"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
APP_BASE_URL = "http://127.0.0.1:8787"
AUTH_TRUST_HOST = "true"
NEXTJS_ENV = "production"
TURSO_DATABASE_URL = "file:./src/db/local.db"

# Runtime secrets must be set with Wrangler, not committed here:
# - AUTH_SECRET
# - AUTH_DISCORD_ID
# - AUTH_DISCORD_SECRET
# - AUTH_GOOGLE_ID
# - AUTH_GOOGLE_SECRET
# - TURSO_AUTH_TOKEN

[env.preview]
name = "tweeva-preview"
workers_dev = true
preview_urls = true

[env.preview.vars]
APP_BASE_URL = "https://<preview-subdomain>.workers.dev"
AUTH_TRUST_HOST = "true"
NEXTJS_ENV = "production"
TURSO_DATABASE_URL = "libsql://<preview-db>.turso.io"

[env.production]
name = "tweeva"
workers_dev = false

[env.production.vars]
APP_BASE_URL = "https://<production-domain>"
AUTH_TRUST_HOST = "true"
NEXTJS_ENV = "production"
TURSO_DATABASE_URL = "libsql://<production-db>.turso.io"
